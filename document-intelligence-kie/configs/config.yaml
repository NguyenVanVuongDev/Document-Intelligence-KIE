preprocessing:
  shadow_removal:
    enabled: true
    bg_kernel_size: 21
    median_blur_ksize: 21
    mode: divide
  deskew:
    enabled: true
    mode: auto
    min_contour_area_ratio: 0.3
    approx_epsilon_ratio: 0.02
    max_rotation_deg: 15.0
    hough_threshold: 80
    hough_min_line_length: 50
    hough_max_line_gap: 10
  clahe:
    enabled: true
    clip_limit: 2.0
    tile_grid_size: 8
ocr:
  engine: paddleocr
  lang: vi
  use_textline_orientation: true
  use_doc_orientation_classify: false
  use_doc_unwarping: false
  text_det_limit_side_len: 1280
  text_det_limit_type: max
  drop_score: 0.5
  max_side_for_ocr: 1280
  enable_mkldnn: false
kie:
  spatial_clustering:
    line_y_overlap_ratio: 0.5
    max_x_gap_ratio: 0.15
    vertical_search_ratio: 1.8
  patterns:
    total_amount: (?:tổng|total|thanh toán|cộng|thành tiền)[^\d]{0,15}([\d.,]+)
    date: \b(\d{1,2}[/\-.]\d{1,2}[/\-.]\d{2,4})\b
    invoice_id: (?:số|no|invoice|hđ|bill)[^\dA-Z]{0,8}([A-Z0-9\-/]{3,20})
    vendor: ^([A-ZĐÀÁẢÃẠĂẮẰẲẴẶÂẤẦẨẪẬÈÉẺẼẸÊẾỀỂỄỆÌÍỈĨỊÒÓỎÕỌÔỐỒỔỖỘƠỚỜỞỠỢÙÚỦŨỤƯỨỪỬỮỰỲÝỶỸỴ][^\n]{3,60})$
  normalize_amount: true
evaluation:
  cer: true
  wer: true
  field_f1_fields:
  - total_amount
  - date
  - invoice_id
  - vendor
io:
  raise_on_corrupt: true
  min_Receipt_height: 120
  min_receipt_width: 120
  split_seed: 42
  split_ratio:
    val: 0.5
    test: 0.5
